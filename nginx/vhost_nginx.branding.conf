# Optional: white-label the Evolution Manager UI at the nginx layer.
# Use this file INSTEAD of vhost_nginx.conf. The container is never modified,
# so image upgrades do not break the branding.
#
# Why: the Manager loads its logo/favicon from evolution-api.com/files/evo/...,
# which return 404, so they never show up anyway.
#
# Replace:
#   /var/www/vhosts/example.com/whatsapp.example.com/branding/  -> your branding folder
#   my-logo.svg / my-logo-white.svg / my-icon.svg               -> your files
#   "My WhatsApp"                                               -> your title

location ^~ /branding/ {
    alias /var/www/vhosts/example.com/whatsapp.example.com/branding/;
    expires 7d;
    access_log off;
}

# Top-left logo is a hard-coded .png path inside the bundle.
# Serving an SVG on a .png path REQUIRES the empty "types { }" block,
# otherwise nginx maps the extension to image/png and the browser won't render it.
location = /assets/images/evolution-logo.png {
    alias /var/www/vhosts/example.com/whatsapp.example.com/branding/my-logo-white.svg;
    types { }
    default_type image/svg+xml;
    expires 7d;
    access_log off;
}

location = /images/evolution-logo.png {
    alias /var/www/vhosts/example.com/whatsapp.example.com/branding/my-logo-white.svg;
    types { }
    default_type image/svg+xml;
    expires 7d;
    access_log off;
}

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # sub_filter cannot rewrite compressed responses
    proxy_set_header Accept-Encoding "";

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # Note: sub_filter may miss matches in very large JS bundles (chunk boundaries).
    # For critical assets prefer "location = ... + alias" as above.
    sub_filter_once off;
    sub_filter_types application/javascript text/javascript;
    sub_filter 'type="image/png" href="https://evolution-api.com/files/evo/favicon.svg"' 'type="image/svg+xml" href="/branding/my-icon.svg"';
    sub_filter 'https://evolution-api.com/files/evo/evolution-logo-white.svg' '/branding/my-logo-white.svg';
    sub_filter 'https://evolution-api.com/files/evo/evolution-logo.svg' '/branding/my-logo.svg';
    sub_filter '<title>Evolution Manager</title>' '<title>My WhatsApp</title>';
    sub_filter '"Evolution Manager"' '"My WhatsApp"';
}
